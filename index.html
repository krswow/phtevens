<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phtevens</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login Page -->
  <div id="login-page" class="page active">
    <div class="login-box">
      <h1>Phtevens</h1>
      <form id="login-form">
        <input type="text" id="username-input" placeholder="Username" required autocomplete="username" />
        <input type="password" id="password-input" placeholder="Password" required autocomplete="current-password" />
        <button type="submit">Login</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-page" class="page hidden">
    <header>
      <h1>Phtevens</h1>
      <div class="header-right">
        <span id="logged-in-user"></span>
        <button id="logout-btn">Logout</button>
      </div>
    </header>

    <main>
      <!-- Leaderboard -->
      <section id="leaderboard">
        <h2>Standings</h2>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Member</th>
              <th>Won</th>
              <th>Lost</th>
              <th>Winnings (DKK)</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </section>

      <!-- Weekly Bets -->
      <section id="weekly-bets">
        <h2>Weekly Coupons</h2>
        <div class="week-controls">
          <button id="prev-week">&#8592; Prev</button>
          <span id="week-label"></span>
          <button id="next-week">Next &#8594;</button>
        </div>
        <div id="coupons-list"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
